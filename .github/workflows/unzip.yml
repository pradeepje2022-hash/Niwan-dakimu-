name: Unzip project to root

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and merge into root
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          echo "Found: $ZIP_FILE"
          rm -rf extracted_temp
          mkdir extracted_temp
          unzip -o "$ZIP_FILE" -d extracted_temp
          rsync -a extracted_temp/ .
          rm -rf extracted_temp
          rm -f "$ZIP_FILE"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files to root" || echo "Nothing to commit"
          git push
